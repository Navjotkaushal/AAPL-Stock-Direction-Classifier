<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AAPL Direction Classifier</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0e14;
    --surface:   #0f1520;
    --border:    #1e2d40;
    --border2:   #2a3f58;
    --text:      #cdd6e0;
    --muted:     #4a6a85;
    --accent:    #00b4d8;
    --accent2:   #0077b6;
    --up:        #23d18b;
    --down:      #f05d5e;
    --warn:      #e8b84b;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --font-ui:   'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  .shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ── Header ───────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 0 1.25rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: .75rem;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .header-title h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .01em; }
  .header-title p  { font-size: .75rem; color: var(--muted); font-family: var(--font-mono); }
  .status-pill {
    display: flex; align-items: center; gap: .4rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: .3rem .85rem;
    font-size: .72rem;
    font-family: var(--font-mono);
    color: var(--muted);
    transition: all .3s;
  }
  .status-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  .status-pill.running .dot  { background: var(--warn); animation: pulse 1s infinite; }
  .status-pill.done .dot     { background: var(--up); }
  .status-pill.error .dot    { background: var(--down); }
  .status-pill.running { color: var(--warn); border-color: var(--warn); }
  .status-pill.done    { color: var(--up);   border-color: var(--up); }
  .status-pill.error   { color: var(--down); border-color: var(--down); }

  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:.3; }
  }

  /* ── Control panel ─────────────────────────────────────────── */
  .control-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .control-group { display: flex; flex-direction: column; gap: .3rem; }
  .control-group label {
    font-size: .7rem;
    font-family: var(--font-mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .control-group input[type="range"] {
    -webkit-appearance: none;
    width: 160px; height: 4px;
    background: var(--border2);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform .15s;
  }
  .control-group input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .range-val {
    font-size: .8rem;
    font-family: var(--font-mono);
    color: var(--accent);
  }
  .btn {
    padding: .6rem 1.4rem;
    border-radius: 8px;
    border: none; cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: all .2s;
    white-space: nowrap;
    font-family: var(--font-ui);
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .btn-secondary:hover:not(:disabled) {
    background: rgba(0,180,216,.1);
    transform: translateY(-1px);
  }
  .btn-separator { flex: 1; }

  /* ── Pipeline log ──────────────────────────────────────────── */
  #pipeline-log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 2rem;
    font-family: var(--font-mono);
    font-size: .78rem;
    display: none;
  }
  #pipeline-log .log-title {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: .75rem;
  }
  .log-step {
    display: flex; align-items: center; gap: .6rem;
    padding: .3rem 0;
    color: var(--up);
    border-bottom: 1px solid var(--border);
  }
  .log-step:last-child { border-bottom: none; }
  .log-step .tick { color: var(--up); font-size: .85rem; }
  .log-current {
    display: flex; align-items: center; gap: .6rem;
    padding: .4rem 0;
    color: var(--warn);
    margin-top: .25rem;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border2);
    border-top-color: var(--warn);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log-error {
    padding: .4rem 0;
    color: var(--down);
    margin-top: .25rem;
  }

  /* ── Section heading ───────────────────────────────────────── */
  .section-head {
    display: flex; align-items: baseline; gap: .6rem;
    margin-bottom: 1rem;
  }
  .section-head h2 { font-size: .95rem; font-weight: 600; }
  .section-head span {
    font-size: .72rem;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  /* ── Prediction cards ──────────────────────────────────────── */
  #predictions-section { display: none; margin-bottom: 2rem; }

  .prediction-meta {
    font-size: .75rem;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-bottom: 1.25rem;
  }
  .pred-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
  .pred-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    transition: border-color .2s;
  }
  .pred-card:hover { border-color: var(--border2); }
  .pred-card.up   { border-left: 3px solid var(--up); }
  .pred-card.down { border-left: 3px solid var(--down); }
  .pred-card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem;
  }
  .pred-model-name {
    font-size: .72rem;
    font-family: var(--font-mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .pred-direction {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .pred-direction.up   { color: var(--up); }
  .pred-direction.down { color: var(--down); }
  .pred-arrow { font-size: 1.4rem; }
  .pred-conf-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: .75rem 0 .4rem;
    overflow: hidden;
  }
  .pred-conf-bar {
    height: 100%;
    border-radius: 2px;
    transition: width .6s ease;
  }
  .up .pred-conf-bar   { background: var(--up); }
  .down .pred-conf-bar { background: var(--down); }
  .pred-conf-label {
    display: flex; justify-content: space-between;
    font-size: .72rem; font-family: var(--font-mono); color: var(--muted);
  }
  .pred-probabilities {
    display: flex; gap: .5rem;
    margin-top: .75rem;
  }
  .prob-chip {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .4rem .6rem;
    text-align: center;
    font-family: var(--font-mono);
    font-size: .75rem;
  }
  .prob-chip .chip-label { color: var(--muted); font-size: .65rem; margin-bottom: .15rem; }
  .prob-chip .chip-val   { font-weight: 600; }
  .prob-chip.up-chip   .chip-val { color: var(--up); }
  .prob-chip.down-chip .chip-val { color: var(--down); }

  /* ── Metrics section ───────────────────────────────────────── */
  #metrics-section { display: none; margin-bottom: 2rem; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 1.5rem; }

  .model-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .model-block-header {
    padding: .85rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .model-block-header .model-name {
    font-size: .8rem;
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .07em;
  }
  .model-block-body { padding: 1.25rem; }

  /* stat row */
  .stat-row { display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .stat-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .5rem .9rem;
    text-align: center;
    min-width: 90px;
  }
  .stat-chip .s-label { font-size: .65rem; font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; margin-bottom: .2rem; }
  .stat-chip .s-val   { font-size: 1.3rem; font-weight: 700; color: var(--accent); }

  /* confusion matrix */
  .cm-label { font-size: .7rem; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .6rem; }
  .cm-grid  { display: grid; grid-template-columns: auto 1fr 1fr; gap: 3px; max-width: 260px; margin-bottom: 1.25rem; font-family: var(--font-mono); font-size: .72rem; }
  .cm-header { padding: .3rem .5rem; color: var(--muted); text-align: center; }
  .cm-row-label { padding: .3rem .5rem; color: var(--muted); display: flex; align-items: center; }
  .cm-cell {
    padding: .5rem;
    border-radius: 4px;
    text-align: center;
    font-weight: 700;
    font-size: .9rem;
  }
  .cm-tp { background: rgba(35,209,139,.18); color: var(--up); }
  .cm-tn { background: rgba(35,209,139,.18); color: var(--up); }
  .cm-fp { background: rgba(240,93,94,.12);  color: var(--down); }
  .cm-fn { background: rgba(240,93,94,.12);  color: var(--down); }

  /* feature importance bars */
  .fi-label { font-size: .7rem; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .75rem; }
  .fi-bar-row {
    display: flex; align-items: center; gap: .6rem;
    margin-bottom: .35rem;
  }
  .fi-name {
    font-family: var(--font-mono); font-size: .7rem; color: var(--text);
    width: 130px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fi-bar-bg {
    flex: 1; height: 8px;
    background: var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .fi-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 4px;
    transition: width .5s ease;
  }
  .fi-pct {
    font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
    width: 38px; text-align: right; flex-shrink: 0;
  }

  /* ── Price history chart ───────────────────────────────────── */
  #chart-section { display: none; margin-bottom: 2rem; }
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  canvas#priceChart { width: 100% !important; }

  /* ── Classification report table ──────────────────────────── */
  .report-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: .72rem; margin-top: .5rem; }
  .report-table th {
    padding: .4rem .6rem;
    text-align: right;
    color: var(--muted); text-transform: uppercase; font-size: .65rem; letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  .report-table th:first-child { text-align: left; }
  .report-table td {
    padding: .4rem .6rem; text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .report-table td:first-child { text-align: left; color: var(--text); }
  .report-table tr:last-child td { border-bottom: none; color: var(--accent); }

  /* ── Toast ────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .7rem 1.2rem;
    font-size: .8rem;
    font-family: var(--font-mono);
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s;
    z-index: 100;
    max-width: 320px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.err  { border-color: var(--down); color: var(--down); }
  #toast.ok   { border-color: var(--up);   color: var(--up); }
</style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">📈</div>
      <div class="header-title">
        <h1>AAPL Direction Classifier</h1>
        <p>RandomForest + XGBoost · Next-day price direction</p>
      </div>
    </div>
    <div id="status-pill" class="status-pill">
      <div class="dot"></div>
      <span id="status-text">Idle</span>
    </div>
  </header>

  <!-- Control Panel -->
  <div class="control-panel">
    <div class="control-group">
      <label>Test Set Size</label>
      <input type="range" id="test-size" min="0.10" max="0.40" step="0.05" value="0.20"
             oninput="document.getElementById('test-size-val').textContent = (this.value*100).toFixed(0)+'%'" />
      <span class="range-val" id="test-size-val">20%</span>
    </div>
    <button class="btn btn-primary" id="btn-run" onclick="runPipeline()">
      ▶ Run Pipeline
    </button>
    <button class="btn btn-secondary" id="btn-predict" onclick="getPredictions()" disabled>
      ⚡ Get Predictions
    </button>
    <div class="btn-separator"></div>
    <span style="font-size:.72rem; color:var(--muted); font-family:var(--font-mono);" id="trained-at-label"></span>
  </div>

  <!-- Pipeline log -->
  <div id="pipeline-log">
    <div class="log-title">▸ Pipeline Log</div>
    <div id="log-steps"></div>
    <div id="log-current"></div>
  </div>

  <!-- Predictions -->
  <section id="predictions-section">
    <div class="section-head">
      <h2>Tomorrow's Prediction</h2>
      <span id="pred-date-label"></span>
    </div>
    <div class="pred-grid" id="pred-grid"></div>
  </section>

  <!-- Metrics -->
  <section id="metrics-section">
    <div class="section-head">
      <h2>Model Performance</h2>
      <span>Test set evaluation</span>
    </div>
    <div class="metrics-grid" id="metrics-grid"></div>
  </section>

  <!-- Price chart -->
  <section id="chart-section">
    <div class="section-head">
      <h2>Price History</h2>
      <span>Train / Test split</span>
    </div>
    <div class="chart-wrap">
      <canvas id="priceChart" height="140"></canvas>
    </div>
  </section>

</div><!-- /shell -->

<div id="toast"></div>

<!-- Chart.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const API = "https://YOUR-APP-NAME.onrender.com";  // ← replace after Render deploy
let pollInterval = null;
let priceChart   = null;

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type="ok", duration=3500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = "", duration);
}

// ── Status pill ────────────────────────────────────────────────────────────
function setStatus(status, text) {
  const pill = document.getElementById("status-pill");
  const span = document.getElementById("status-text");
  pill.className = "status-pill " + status;
  span.textContent = text;
}

// ── Run pipeline ───────────────────────────────────────────────────────────
async function runPipeline() {
  const testSize = parseFloat(document.getElementById("test-size").value);
  document.getElementById("btn-run").disabled = true;
  document.getElementById("btn-predict").disabled = true;
  document.getElementById("predictions-section").style.display = "none";
  document.getElementById("metrics-section").style.display = "none";
  document.getElementById("chart-section").style.display = "none";

  const logEl = document.getElementById("pipeline-log");
  logEl.style.display = "block";
  document.getElementById("log-steps").innerHTML = "";
  document.getElementById("log-current").innerHTML = "";

  setStatus("running", "Running…");

  try {
    const res = await fetch(`${API}/run-pipeline`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ test_size: testSize })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Failed to start pipeline");
    }
    pollPipelineStatus();
  } catch (e) {
    setStatus("error", "Error");
    document.getElementById("log-current").innerHTML =
      `<div class="log-error">✖ ${e.message}</div>`;
    document.getElementById("btn-run").disabled = false;
    toast("Pipeline failed: " + e.message, "err", 5000);
  }
}

// ── Poll pipeline status ───────────────────────────────────────────────────
function pollPipelineStatus() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const res  = await fetch(`${API}/pipeline-status`);
      const data = await res.json();
      updatePipelineLog(data);

      if (data.status === "done") {
        clearInterval(pollInterval);
        setStatus("done", "Ready");
        document.getElementById("btn-run").disabled = false;
        document.getElementById("btn-predict").disabled = false;
        if (data.trained_at) {
          document.getElementById("trained-at-label").textContent =
            "Last trained: " + data.trained_at;
        }
        toast("Pipeline complete — click Get Predictions", "ok");
      } else if (data.status === "error") {
        clearInterval(pollInterval);
        setStatus("error", "Failed");
        document.getElementById("btn-run").disabled = false;
        toast("Pipeline error: " + (data.error || "unknown"), "err", 6000);
      }
    } catch (e) {
      clearInterval(pollInterval);
      toast("Lost connection to API", "err");
    }
  }, 1200);
}

function updatePipelineLog(data) {
  const stepsEl   = document.getElementById("log-steps");
  const currentEl = document.getElementById("log-current");

  stepsEl.innerHTML = data.steps_done.map(s =>
    `<div class="log-step"><span class="tick">✔</span>${s.label}</div>`
  ).join("");

  if (data.status === "running") {
    currentEl.innerHTML = `
      <div class="log-current">
        <div class="spinner"></div>
        ${data.step}
      </div>`;
  } else if (data.status === "error") {
    currentEl.innerHTML = `<div class="log-error">✖ ${data.error}</div>`;
  } else {
    currentEl.innerHTML = "";
  }
}

// ── Get predictions ────────────────────────────────────────────────────────
async function getPredictions() {
  document.getElementById("btn-predict").disabled = true;
  setStatus("running", "Fetching…");

  try {
    const res  = await fetch(`${API}/predict`);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Prediction failed");
    }
    const data = await res.json();
    renderPredictions(data);
    renderMetrics(data.metrics);
    renderPriceChart(data.split_data);
    setStatus("done", "Ready");
    toast("Predictions loaded", "ok");
  } catch (e) {
    setStatus("error", "Error");
    toast(e.message, "err", 5000);
  } finally {
    document.getElementById("btn-predict").disabled = false;
  }
}

// ── Render predictions ─────────────────────────────────────────────────────
function renderPredictions(data) {
  const sec    = document.getElementById("predictions-section");
  const grid   = document.getElementById("pred-grid");
  const dateEl = document.getElementById("pred-date-label");

  dateEl.textContent = `Based on data up to ${data.as_of_date} · Not financial advice`;
  grid.innerHTML = "";

  for (const [model, result] of Object.entries(data.predictions)) {
    const isUp = result.direction === "UP";
    const cls  = isUp ? "up" : "down";
    const conf = result.confidence;
    const pctDisplay = conf.toFixed(1) + "%";

    grid.innerHTML += `
      <div class="pred-card ${cls}">
        <div class="pred-card-header">
          <span class="pred-model-name">${model}</span>
          <span class="pred-arrow">${isUp ? "📈" : "📉"}</span>
        </div>
        <div class="pred-direction ${cls}">${isUp ? "⬆ UP" : "⬇ DOWN"}</div>
        <div class="pred-conf-bar-bg">
          <div class="pred-conf-bar" style="width:${conf}%"></div>
        </div>
        <div class="pred-conf-label">
          <span>Confidence</span><span>${pctDisplay}</span>
        </div>
        <div class="pred-probabilities">
          <div class="prob-chip up-chip">
            <div class="chip-label">P(UP)</div>
            <div class="chip-val">${(result.prob_up * 100).toFixed(1)}%</div>
          </div>
          <div class="prob-chip down-chip">
            <div class="chip-label">P(DOWN)</div>
            <div class="chip-val">${(result.prob_down * 100).toFixed(1)}%</div>
          </div>
        </div>
      </div>
    `;
  }
  sec.style.display = "block";
}

// ── Render metrics ─────────────────────────────────────────────────────────
function renderMetrics(metrics) {
  const sec  = document.getElementById("metrics-section");
  const grid = document.getElementById("metrics-grid");
  grid.innerHTML = "";

  for (const [model, m] of Object.entries(metrics)) {
    const cm  = m.confusion_matrix; // [[TN,FP],[FN,TP]]
    const tn  = cm[0][0], fp = cm[0][1];
    const fn  = cm[1][0], tp = cm[1][1];

    // Feature importance bars (top 10)
    const topFeats = m.feature_importance.slice(0, 10);
    const maxImp   = topFeats[0][1];
    const fiBars   = topFeats.map(([name, imp]) => `
      <div class="fi-bar-row">
        <span class="fi-name" title="${name}">${name}</span>
        <div class="fi-bar-bg">
          <div class="fi-bar-fill" style="width:${(imp/maxImp*100).toFixed(1)}%"></div>
        </div>
        <span class="fi-pct">${(imp*100).toFixed(1)}%</span>
      </div>
    `).join("");

    // Classification report
    const rpt = m.report;
    const reportRows = ["Down","Up","macro avg","weighted avg"].map(cls => {
      const r = rpt[cls] || rpt[cls.toLowerCase()] || {};
      return `
        <tr>
          <td>${cls}</td>
          <td>${(r.precision||0).toFixed(3)}</td>
          <td>${(r.recall||0).toFixed(3)}</td>
          <td>${(r["f1-score"]||0).toFixed(3)}</td>
          <td>${r.support||"—"}</td>
        </tr>`;
    }).join("");

    grid.innerHTML += `
      <div class="model-block">
        <div class="model-block-header">
          <span class="model-name">${model}</span>
        </div>
        <div class="model-block-body">

          <!-- Key stats -->
          <div class="stat-row">
            <div class="stat-chip">
              <div class="s-label">Accuracy</div>
              <div class="s-val">${(m.accuracy*100).toFixed(1)}%</div>
            </div>
            <div class="stat-chip">
              <div class="s-label">ROC-AUC</div>
              <div class="s-val">${m.roc_auc.toFixed(3)}</div>
            </div>
            <div class="stat-chip">
              <div class="s-label">TP</div>
              <div class="s-val" style="color:var(--up)">${tp}</div>
            </div>
            <div class="stat-chip">
              <div class="s-label">TN</div>
              <div class="s-val" style="color:var(--up)">${tn}</div>
            </div>
          </div>

          <!-- Confusion matrix -->
          <div class="cm-label">Confusion Matrix</div>
          <div class="cm-grid">
            <div class="cm-header"></div>
            <div class="cm-header">Pred DOWN</div>
            <div class="cm-header">Pred UP</div>
            <div class="cm-row-label">Actual DOWN</div>
            <div class="cm-cell cm-tn">${tn}</div>
            <div class="cm-cell cm-fp">${fp}</div>
            <div class="cm-row-label">Actual UP</div>
            <div class="cm-cell cm-fn">${fn}</div>
            <div class="cm-cell cm-tp">${tp}</div>
          </div>

          <!-- Classification report -->
          <table class="report-table">
            <thead>
              <tr>
                <th>Class</th><th>Precision</th><th>Recall</th><th>F1</th><th>Support</th>
              </tr>
            </thead>
            <tbody>${reportRows}</tbody>
          </table>

          <!-- Feature importance -->
          <div class="fi-label" style="margin-top:1.25rem">Top Features</div>
          ${fiBars}
        </div>
      </div>
    `;
  }
  sec.style.display = "block";
}

// ── Price chart ────────────────────────────────────────────────────────────
function renderPriceChart(splitData) {
  const sec = document.getElementById("chart-section");
  if (!splitData || !splitData.train_dates) return;

  if (priceChart) priceChart.destroy();

  const ctx = document.getElementById("priceChart").getContext("2d");
  const trainLabels = splitData.train_dates;
  const testLabels  = splitData.test_dates;
  const allLabels   = [...trainLabels, ...testLabels];

  const trainData   = splitData.train_close.map((v,i) => ({ x: trainLabels[i], y: v }));
  const testData    = splitData.test_close.map((v,i)  => ({ x: testLabels[i],  y: v }));

  priceChart = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [
        {
          label: "Train",
          data: trainData,
          borderColor: "#0077b6",
          backgroundColor: "rgba(0,119,182,.08)",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: .3,
          fill: true,
        },
        {
          label: "Test",
          data: testData,
          borderColor: "#00b4d8",
          backgroundColor: "rgba(0,180,216,.06)",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: .3,
          fill: true,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#4a6a85", font: { family: "'JetBrains Mono', monospace", size: 11 } }
        },
        tooltip: {
          backgroundColor: "#0f1520",
          borderColor: "#1e2d40",
          borderWidth: 1,
          titleColor: "#4a6a85",
          bodyColor: "#cdd6e0",
          titleFont: { family: "'JetBrains Mono', monospace", size: 10 },
          bodyFont:  { family: "'JetBrains Mono', monospace", size: 11 },
          callbacks: { label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}` }
        }
      },
      scales: {
        x: {
          type: "category",
          ticks: {
            color: "#4a6a85",
            font: { family: "'JetBrains Mono', monospace", size: 10 },
            maxTicksLimit: 10,
          },
          grid: { color: "#1e2d40" }
        },
        y: {
          ticks: {
            color: "#4a6a85",
            font: { family: "'JetBrains Mono', monospace", size: 10 },
            callback: v => "$" + v.toFixed(0)
          },
          grid: { color: "#1e2d40" }
        }
      }
    }
  });
  sec.style.display = "block";
}

// ── On load: check if model already exists ─────────────────────────────────
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const res  = await fetch(`${API}/health`);
    const data = await res.json();
    if (data.model_ready) {
      setStatus("done", "Ready");
      document.getElementById("btn-predict").disabled = false;
      document.getElementById("trained-at-label").textContent =
        "Model available — click Get Predictions or re-run pipeline";
    }
  } catch (_) {
    setStatus("error", "API offline");
    toast("Cannot reach API at localhost:8000", "err", 6000);
  }
});
</script>
</body>
</html>
